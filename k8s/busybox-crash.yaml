apiVersion: apps/v1
kind: Deployment
metadata:
  name: busybox-crash-demo
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: busybox-crash-demo
  template:
    metadata:
      labels:
        app: busybox-crash-demo
    spec:
      containers:
        - name: busybox
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Starting application..."
              sleep 5
              echo "ERROR: Application failed during startup"
              tail -f /dev/null
              # exit 1


