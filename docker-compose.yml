version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: ordersdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres-data:/var/lib/postgresql/data

  order-service:
    image: order-service:v1
    container_name: order-service
    restart: always
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_NAME: ordersdb
      DB_USER: postgres
      DB_PASSWORD: password
      DB_PORT: 5432
    ports:
      - "5001:5001"

  user-service:
    image: user-service:v1
    container_name: user-service
    restart: always
    depends_on:
      - order-service
    environment:
      ORDER_SERVICE_URL: http://order-service:5001
    ports:
      - "5000:5000"

volumes:
  postgres-data: